{% extends "base.html" %}
{% block title %}Şoför girişi · Seferim{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Şoför girişi</h1>
  <p class="lede">Yöneticinin kaydettiği telefon numaranızla giriş yapın.</p>
  <form method="post" class="stack-form">
    <label>
      <span>Telefon</span>
      <input name="phone" required maxlength="20" placeholder="05xx xxx xx xx" autofocus>
    </label>
    <button type="submit" class="btn btn-primary">Giriş yap</button>
  </form>
  <p class="muted">Hesabınız yoksa yöneticiden kayıt isteyin.</p>
</section>
{% endblock %}
